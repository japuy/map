<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Device Simulator - Kirim Data Lokasi</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="device-page">
    <div class="device-container">
      <div class="device-header">
        <h1>📡 Device Simulator</h1>
        <div class="subtitle">Simulasikan pergerakan device &amp; kirim data lokasi realtime ke server</div>
      </div>

      <div class="device-body">
        <div class="form-section">
          <div class="form-row">
            <div>
              <label class="form-label" for="pairingCode">Pairing Code Device</label>
              <input id="pairingCode" class="form-input" type="text"
                placeholder="Contoh: DEV-1234" maxlength="14" value="DEV-1234" />
            </div>
            <div>
              <label class="form-label" for="simMode">Mode Simulasi Pergerakan</label>
              <select id="simMode" class="form-select">
                <option value="random">Jalan Acak (Random Walk)</option>
                <option value="circle">Berputar Lingkaran</option>
                <option value="static">Statis (Diam di Tempat)</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div>
              <label class="form-label" for="baseLat">Latitude Awal</label>
              <input id="baseLat" class="form-input" type="number" step="0.0001" value="-6.2088" />
            </div>
            <div>
              <label class="form-label" for="baseLng">Longitude Awal</label>
              <input id="baseLng" class="form-input" type="number" step="0.0001" value="106.8456" />
            </div>
          </div>
        </div>

        <div class="button-row">
          <button id="startBtn" class="btn btn-success">▶ Mulai Simulasi</button>
          <button id="stopBtn" class="btn btn-secondary" disabled>⏹ Berhenti Simulasi</button>
          <button id="geoBtn" class="btn btn-primary" title="Gunakan lokasi GPS asli browser">📍 Pakai Lokasi Asli</button>
        </div>

        <div class="form-row" style="grid-template-columns: 1fr;">
          <div>
            <label class="form-label">Koneksi Server</label>
            <div id="connStatus" class="connection-status cs-off">
              <span class="cs-dot"></span>
              <span id="connText">Terputus dari server</span>
            </div>
          </div>
        </div>

        <div class="status-grid">
          <div class="status-tile">
            <span class="status-label">Latitude</span>
            <div id="curLat" class="status-value">-</div>
          </div>
          <div class="status-tile">
            <span class="status-label">Longitude</span>
            <div id="curLng" class="status-value">-</div>
          </div>
          <div class="status-tile">
            <span class="status-label">Kecepatan</span>
            <div id="curSpeed" class="status-value">-</div>
          </div>
          <div class="status-tile">
            <span class="status-label">Update Terakhir</span>
            <div id="curTime" class="status-value">-</div>
          </div>
        </div>

        <div class="log-panel">
          <div class="log-head">
            <h3>Log Pengiriman Data</h3>
            <button id="clearLog" class="btn btn-xs btn-secondary">Bersihkan Log</button>
          </div>
          <div id="logBody" class="log-body"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/device.js"></script>
</body>
</html>
